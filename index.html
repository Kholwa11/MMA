<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMA | Legacy Meets Precision</title>
    <!-- Tailwind CSS (CDN for zero-install) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        moss: '#4E6833',
                        earth: '#6b4e31',
                        paper: '#F9F9F9',
                        dark: '#0A0A0A'
                    },
                    fontFamily: {
                        heading: ['"Inter"', 'sans-serif'],
                        body: ['"Merriweather"', 'serif'],
                        mono: ['"Roboto Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Merriweather:wght@300;400;700&family=Roboto+Mono:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- ES Modules Import Map -->
    <!-- The exact module versions ensure stability without node_modules -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0?dev",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?dev",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
            "gsap": "https://esm.sh/gsap@3.12.2"
        }
    }
    </script>
    <!-- Babel for on-the-fly JSX transpilation (Dev Server Compatible) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            background-color: #F9F9F9;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0A0A0A;
        }

        ::-webkit-scrollbar-thumb {
            background: #4E6833;
        }

        .glass-nav {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(249, 249, 249, 0.75);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .glow-card {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glow-card:hover {
            box-shadow: 0 0 40px rgba(78, 104, 51, 0.15);
            border-color: rgba(78, 104, 51, 0.4);
            transform: translateY(-8px);
        }

        svg {
            display: inline-block;
        }
    </style>
</head>

<body class="bg-paper text-dark font-body selection:bg-moss selection:text-paper">
    <div id="root"></div>
    <script type="text/babel" data-type="module" src="./app.jsx"></script>
</body>

</html>
